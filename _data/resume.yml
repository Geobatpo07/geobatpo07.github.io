# Headline and summary of each CV.
profile_headline:
  fr: "Mathématicien appliqué et data scientist"
  en: "Applied Mathematician & Data Scientist"
profile_summary:
  fr: |
    Titulaire d'un master Mathématiques et applications de l'Université des Antilles, spécialité Modélisation et outils d'aide à la décision, orientation environnement et santé. Mon travail se situe à la croisée des mathématiques appliquées, de la modélisation mathématique et du calcul scientifique, et s'étend à la data science et à l'intelligence artificielle au service de l'aide à la décision en environnement et en santé. En parallèle de mes recherches, j'exerce de 2023 à août 2026 comme Développeur Full-Stack & Data Analyst chez Solutions S.A., et j'enseigne les mathématiques et la data science à l'Université Quisqueya.

    Mes recherches visent à construire des modèles mathématiques assez rigoureux pour comprendre des systèmes complexes et assez fiables pour éclairer de vraies décisions : aujourd'hui la modélisation de contaminations environnementales, les méthodes numériques pour la propagation d'ondes et un cadre d'IA reproductible pour la recherche. Mon objectif à long terme est une thèse à la croisée du calcul scientifique et de l'intelligence artificielle, appliquée à l'aide à la décision.

    Mes domaines de compétence couvrent les mathématiques pures et appliquées, l'analyse numérique, la statistique et la biostatistique, l'apprentissage automatique et le data engineering, avec un attachement constant à la reproductibilité et à l'interprétabilité plutôt qu'aux boîtes noires.
  en: |
    I hold a Master's degree in Mathematics and Applications from the Université des Antilles, specializing in Mathematical Modelling and Decision Support Tools with a focus on Environment and Health. My work sits at the intersection of applied mathematics, mathematical modelling, and scientific computing, extending into data science and artificial intelligence in service of environmental and healthcare decision support. Alongside my research, I worked as a Full-Stack Developer & Data Analyst at Solutions S.A. from 2023 to August 2026, and I teach mathematics and data science at Université Quisqueya.

    My research interests center on building mathematical models rigorous enough to understand complex systems and reliable enough to support real decisions: currently expressed through environmental contamination modelling, numerical methods for wave propagation, and a reproducible AI research framework. My long-term objective is doctoral research at the intersection of scientific computing and artificial intelligence, applied to real-world decision support.

    My areas of expertise span pure and applied mathematics, numerical analysis, statistics and biostatistics, machine learning, and data engineering, grounded throughout in a commitment to reproducibility and interpretability over black-box results.

software_headline:
  fr: "Développeur Full-Stack C#/.NET · Java"
  en: "Full-Stack Developer · C#/.NET · Java"
software_summary:
  fr: "Développeur full-stack : applications C#/ASP.NET Core et Java/Spring Boot, API REST et microservices conteneurisés avec Docker. De 2023 à 2026, en équipe Scrum dans le secteur de la santé, de la migration d'applications existantes au déploiement."
  en: "Full-stack developer: C#/ASP.NET Core and Java/Spring Boot applications, REST APIs and microservices containerized with Docker. From 2023 to 2026, in a Scrum team in the healthcare sector, from legacy application migration to deployment."

data_headline:
  fr: "Data Engineer · Data Analyst"
  en: "Data Engineer · Data Analyst"
data_summary:
  fr: "Data engineer et data analyst certifié Microsoft Fabric (DP-700, DP-600). De 2023 à 2026, pipelines ETL, architectures Lakehouse et tableaux de bord Power BI sur des données de santé, avec une attention constante à leur qualité. Master de mathématiques appliquées."
  en: "Data engineer and data analyst, Microsoft Fabric certified (DP-700, DP-600). From 2023 to 2026, ETL pipelines, lakehouse architectures and Power BI dashboards on healthcare data, with steady attention to data quality. Master's degree in applied mathematics."

research_headline:
  fr: "Mathématiques appliquées · Modélisation et calcul scientifique"
  en: "Applied Mathematics · Modelling and Scientific Computing"
research_summary:
  fr: "Master Mathématiques et applications (modélisation et aide à la décision). Modélisation par EDO et EDP, analyse numérique et simulation en Python et R, appliquées à l'environnement et à la santé ; enseignement des mathématiques pour l'informatique."
  en: "Master's degree in Mathematics and Applications (modelling and decision support). ODE and PDE modelling, numerical analysis and simulation in Python and R, applied to environment and health; teaching mathematics for computer science."

