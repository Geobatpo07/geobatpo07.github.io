# ==========================================================================
# TRACKS — the three career tracks the site presents.
#
# Keys (software, data, research) are the identifiers used in the `tracks`
# field of experience.yml, projects.yml, skills.yml, education.yml and
# certifications.yml. Every displayed string is a {fr, en} pair.
#
# Each track is a self-contained space: its header, footer and contact page
# never link to the portal or to another space.
#   cv_url:   target of the "CV" menu entry (defaults to /files/<cv>)
#   stories:  true to show the Stories blog link in the space menu
#   extra_nav: additional menu entries, each { label: {fr, en}, url }
#   contact:  contact page of the space (/<space>/contact/): mail subject,
#             title, intro, SEO description; optional calendly (booking
#             embed) and profiles (extra links, keys of site.author)
# See docs/CONTENT.md.
# ==========================================================================

software:
  url: /software/
  icon: "fa-solid fa-code"
  cv: CV_Laguerre_Software.pdf
  stories: false
  contact:
    subject: "[Software]"
    title: { fr: "Contact : ingénierie logicielle", en: "Contact: software engineering" }
    seo_description:
      fr: "Contacter Geovany Laguerre pour un poste ou une mission de développement : C#/.NET, Java, TypeScript, API REST, microservices."
      en: "Contact Geovany Laguerre about a software development role or engagement: C#/.NET, Java, TypeScript, REST APIs, microservices."
    intro:
      fr: "Un poste de développeur, une mission sur une application C#/.NET ou Java, une API à concevoir ou à reprendre : écrivez-moi en décrivant le contexte, la stack et le calendrier. Je réponds en général sous quelques jours ouvrés."
      en: "A developer role, an engagement on a C#/.NET or Java application, an API to design or take over: write to me with the context, the stack and the timeline. I usually reply within a few business days."
  nav: { fr: "Software", en: "Software" }
  card_title: { fr: "Software engineering", en: "Software engineering" }
  card_text:
    fr: "Applications C#/.NET et Java, API REST, microservices."
