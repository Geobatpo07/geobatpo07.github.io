  title: { fr: "Ingénierie logicielle", en: "Software Engineering" }
  tagline:
    fr: "Applications C#/.NET et Java, API REST et microservices, de la logique métier au déploiement conteneurisé."
    en: "C#/.NET and Java applications, REST APIs and microservices, from business logic to containerized deployment."
  seo_title:
    fr: "Software Engineer C#/.NET, Java, TypeScript"
    en: "Software Engineer: C#/.NET, Java, TypeScript"
  seo_description:
    fr: "Geovany Laguerre, développeur full-stack : C#/ASP.NET Core, Java/Spring Boot, TypeScript, microservices, API REST, Docker. Expérience, projets et CV."
    en: "Geovany Laguerre, full-stack developer: C#/ASP.NET Core, Java/Spring Boot, TypeScript, microservices, REST APIs, Docker. Experience, projects and CV."

