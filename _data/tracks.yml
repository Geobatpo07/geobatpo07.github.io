# ==========================================================================
# TRACKS — the three career tracks the site presents.
#
# Keys (software, data, research) are the identifiers used in the `tracks`
# field of experience.yml, projects.yml, skills.yml, education.yml and
# certifications.yml. Every displayed string is a {fr, en} pair.
#
# Each track is a self-contained space: its header, footer and contact page
# never link to the portal or to another space.
#   cv_file:  base name of the generated CV PDFs: the CI writes
#             files/<cv_file>_FR.pdf and files/<cv_file>_EN.pdf from the print
#             pages /<space>/print/ and /en/<space>/print/
#   cv:       content of the generated CV (see docs/CONTENT.md): max_pages,
#             headline, summary, experience and projects (ids, in order),
#             certifications (block | line), publications (true to list
#             the _publications collection)
#   stories:  true to show the Stories blog link in the space menu
#   extra_nav: additional menu entries, each { label: {fr, en}, url }
#   contact:  contact page of the space (/<space>/contact/): mail subject,
#             title, intro, SEO description; optional calendly (booking
#             embed) and profiles (extra links, keys of site.author)
# See docs/CONTENT.md.
# ==========================================================================

