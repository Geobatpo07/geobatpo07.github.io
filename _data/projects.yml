- id: datahut-duckhouse
  name: "DataHut-DuckHouse"
  github: "https://github.com/Geobatpo07/datahut-duckhouse"
  case_study: /projects/datahut/
  stack: ["Python", "DuckDB", "Apache Iceberg", "Arrow Flight", "dbt", "Trino", "MinIO"]
  status: active
  featured: true
  tracks: { data: 1, software: 6, research: 5 }
  description:
    fr: "Plateforme analytique multi-tenant, locale ou cloud : ingestion par Arrow Flight, stockage hybride DuckDB et Iceberg (MinIO/S3), transformations dbt et requêtes Trino."
    en: "A multi-tenant analytics platform, local or cloud: Arrow Flight ingestion, hybrid DuckDB and Iceberg storage (MinIO/S3), dbt transformations and Trino queries."
  research:
    question:
      fr: "À quoi ressemble une infrastructure de données de recherche quand la reproductibilité, et non le volume, est la contrainte principale ?"
      en: "What does research-grade data infrastructure look like when reproducibility, not scale, is the primary constraint?"
    motivation:
      fr: "La plupart des stacks analytiques sont optimisées pour le volume de l'entreprise, pas pour la reproductibilité scientifique."
      en: "Most analytics stacks optimize for business scale, not scientific reproducibility."
    methodology:
      fr: "Une plateforme multi-tenant qui combine DuckDB, Apache Iceberg, Arrow Flight, dbt et Trino."
      en: "A multi-tenant analytics platform integrating DuckDB, Apache Iceberg, Arrow Flight, dbt, and Trino."
    contribution:
      fr: "Une architecture de référence open source pour une infrastructure de données de recherche modulaire et reproductible."
      en: "An open-source reference architecture for reproducible, modular research data infrastructure."

- id: scientific-assistant
  name: "Scientific Assistant"
  github: "https://github.com/Geobatpo07/scientific-assistant"
  case_study: /projects/scientific-assistant/
  stack: ["Python", "LangChain", "Ollama", "ChromaDB", "RAG"]
  status: active
  tracks: { research: 2, data: 4 }
  description:
    fr: "Système multi-agents exécuté en local : huit agents spécialisés (planification, mathématiques symboliques, méthodes numériques, statistiques, bibliographie, relecture, rédaction, mémoire) et un RAG hybride vectoriel et lexical. Produit du code Python exécutable et des citations."
    en: "A local multi-agent system: eight specialized agents (planning, symbolic mathematics, numerical methods, statistics, literature, review, writing, memory) and hybrid vector and keyword RAG. Produces executable Python code and citations."
  research:
    question:
      fr: "Un système d'IA multi-agents peut-il combiner mathématiques symboliques, méthodes numériques et recherche bibliographique sans sacrifier la reproductibilité ?"
      en: "Can a multi-agent AI system combine symbolic mathematics, numerical methods, and literature retrieval without sacrificing reproducibility?"
    motivation:
      fr: "La recherche reproductible a besoin d'outils qui ne délèguent pas le jugement à un modèle opaque."
      en: "Reproducible research needs tooling that doesn't outsource judgment to an opaque model."
    methodology:
      fr: "Une architecture multi-agents locale qui associe raisonnement symbolique, méthodes numériques et analyse documentaire par RAG."
      en: "A local-first, multi-agent architecture combining symbolic reasoning, numerical methods, and RAG-based document intelligence."
    contribution:
      fr: "Un cadre d'assistant de recherche transparent, que d'autres chercheurs peuvent adapter."
      en: "A transparent AI research assistant framework other researchers could adapt."

- id: simulation-chlordecone
  name: "Simulation chlordécone"
  github: "https://github.com/Geobatpo07/simulation-chlordecone"
  case_study: /projects/chlordecone/
  stack: ["R", "Shiny", { fr: "EDO non autonomes", en: "Non-autonomous ODEs" }, "renv"]
  status: active
  featured: true
  tracks: { research: 1, data: 5 }
  links:
    - label: { fr: "Application Shiny", en: "Shiny app" }
      url: "https://fsu5hs-geovany0batista0polo-laguerre.shinyapps.io/chlordecone-simulation-app/"
    - label: { fr: "Prépublication (DOI)", en: "Preprint (DOI)" }
      url: "https://doi.org/10.13140/RG.2.2.36238.01607"
  description:
    fr: "Modèle compartimental d'EDO non autonome de la contamination au chlordécone sous forçage saisonnier des pluies, avec une application Shiny pour simuler l'exposition humaine et des stratégies d'intervention. Code associé à une prépublication."
    en: "A non-autonomous compartmental ODE model of chlordecone contamination under seasonal rainfall forcing, with a Shiny app to simulate human exposure and intervention strategies. Code accompanying a preprint."
  research:
    question:
      fr: "Un modèle compartimental peut-il décrire l'exposition saisonnière au chlordécone, pilotée par les pluies, assez finement pour éclairer des seuils de santé publique ?"
      en: "Can a compartmental model capture seasonal, rainfall-driven chlordecone exposure precisely enough to inform public-health thresholds?"
    motivation:
      fr: "La contamination chronique des sols et de la chaîne alimentaire en Guadeloupe appelle des estimations quantitatives de l'exposition, pas seulement des catégories de risque."
      en: "Chronic soil and food-chain contamination in Guadeloupe needs quantitative exposure estimates, not just qualitative risk categories."
    methodology:
      fr: "Systèmes d'EDO compartimentaux non autonomes avec forçage saisonnier, explorés par simulation interactive."
      en: "Non-autonomous compartmental ODE systems with seasonal forcing, explored through interactive simulation."
    contribution:
      fr: "Un cadre de modélisation réutilisable pour l'exposition environnementale saisonnière, au-delà du seul chlordécone."
      en: "A reusable modelling framework for seasonal environmental exposure that could generalize beyond chlordecone."

- id: medical-triage-system
  name: "Medical Triage System"
  github: "https://github.com/Geobatpo07/MedicalTriageSystem"
  case_study: /projects/medical-triage-system/
  stack: ["C++", "Random Forest", "CSV"]
  status: prototype
  tracks: { research: 3, data: 6 }
  description:
    fr: "Application C++ de triage : un modèle Random Forest classe les patients en trois niveaux (critique, modéré, faible) à partir de leurs symptômes et facteurs de risque."
    en: "A C++ triage application: a Random Forest model classifies patients into three levels (critical, moderate, low) from their symptoms and risk factors."
  research:
    question:
      fr: "Un modèle léger et interprétable peut-il fournir aux soignants un signal de pré-triage fiable sans se substituer à leur jugement ?"
      en: "Can a lightweight, interpretable model give clinicians a trustworthy pre-triage signal without replacing their judgment?"
    motivation:
      fr: "Les contextes d'urgence et de santé publique demandent une aide à la décision rapide, interprétable et honnête sur sa propre incertitude."
      en: "Emergency and public-health contexts need decision support that is fast, interpretable, and honest about its own uncertainty."
    methodology:
      fr: "Un outil de priorisation fondé sur un Random Forest, second angle sur la même question que le travail sur le chlordécone : des modèles dignes de confiance pour les décisions de santé."
      en: "A Random Forest-based triage prioritization tool, developed as a second angle on the same underlying question as the chlordecone work: trustworthy models for health decisions."
    contribution:
      fr: "Un modèle d'outil d'aide à la décision interprétable et validé pour des contextes cliniques aux ressources limitées."
      en: "A template for interpretable, validated decision-support tools in resource-constrained clinical settings."

