- id: stories
  name: "Stories"
  github: "https://github.com/Geobatpo07/stories"
  stack: ["TypeScript", "Next.js", "DuckDB", "Zod", "Vitest", "GitHub Actions"]
  status: active
  featured: true
  tracks: { software: 1 }
  description:
    fr: "Plateforme Next.js qui organise les programmes, hypothèses, expériences et publications d'un laboratoire de recherche dans un modèle de connaissances typé. La publication génère des fichiers MDX et un index DuckDB ; la CI enchaîne typage, lint, tests et build."
    en: "A Next.js platform that organizes a research lab's programs, hypotheses, experiments and publications in a typed knowledge model. Publishing generates MDX files and a DuckDB index; CI runs type-checking, linting, tests and the build."

