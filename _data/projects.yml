- id: character-theory
  name: "Character Theory over Finite Fields"
  case_study: /research/character-theory-finite-fields/
  stack: [{ fr: "Théorie des groupes", en: "Group theory" }, { fr: "Corps finis", en: "Finite fields" }, { fr: "Théorie des caractères", en: "Character theory" }]
  status: presented
  tracks: { research: 4 }
  links:
    - label: { fr: "Présentation (DOI)", en: "Presentation (DOI)" }
      url: "https://doi.org/10.13140/RG.2.2.13837.45285"
  description:
    fr: "Construction des caractères additifs d'un corps fini et de leurs relations d'orthogonalité, avec leurs applications en mathématiques discrètes."
    en: "Construction of the additive characters of a finite field and their orthogonality relations, with applications in discrete mathematics."
  research:
    question:
      fr: "Que révèlent les relations d'orthogonalité des caractères additifs sur la structure des corps finis ?"
      en: "What do the orthogonality relations of additive characters reveal about structure in finite fields?"
    motivation:
      fr: "Un fil théorique qui entretient les fondations mathématiques : de la structure pure, sans contrainte d'application."
      en: "A theoretical thread that keeps the mathematical foundation sharp: pure structure, no application pressure."
    methodology:
      fr: "Construction formelle des caractères additifs et de leurs relations d'orthogonalité, développée pas à pas."
      en: "Formal construction of additive characters and their orthogonality relations, worked through directly."
    contribution:
      fr: "Un exposé clair et présentable d'un résultat fondamental de la théorie des corps finis."
      en: "A clear, presentable account of a foundational result in finite field theory."
