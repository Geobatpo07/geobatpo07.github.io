# ==========================================================================
# SKILLS — grouped by category, shown as badges on the track pages.
#
#   tracks: { <track>: <priority> }  where the category appears, and its rank.
#   items:  a plain string, or { name, tracks } to restrict one item to some
#           tracks (a list), or { name: {fr, en} } when the term translates.
#   cv:     false to keep the category on the site but off the generated CVs.
#
# See docs/CONTENT.md.
# ==========================================================================

