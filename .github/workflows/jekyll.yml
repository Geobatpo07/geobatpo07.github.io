# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Pull requests into master (and manual runs): build, generate the CVs
  # and run the checks, without uploading or deploying anything.
  pull_request:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
# Pull requests get their own group, cancelled by a newer push to the same PR.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.207.0
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        # Skipped on pull requests: base_path is then empty (custom domain).
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Chrome for the CV PDFs
        # The build renders the CV PDFs with Chrome headless
        # (_plugins/cv_pdf.rb, through Ferrum). GitHub's Ubuntu runners ship
        # Google Chrome; install it only when it is missing.
        id: chrome
        run: |
          for bin in google-chrome google-chrome-stable chromium chromium-browser; do
            if path="$(command -v "$bin")"; then
              echo "Chrome found: $path ($("$path" --version))"
              echo "path=$path" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Chrome not found on the runner, installing it."
      - name: Install Chrome
        if: steps.chrome.outputs.path == ''
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      - name: Liberation fonts
        # Fonts of the print stylesheets (Arial and Times fallbacks), as in
        # the Docker image, for the same rendering everywhere.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation
      - name: Validate resume.yml
        # Resume Loader validation — fails the build with a clear error
        # list if _data/resume.yml is missing required fields.
        run: ruby scripts/validate_resume.rb
      - name: Build with Jekyll and generate the CV PDFs
        # Outputs to './_site'. _plugins/cv_pdf.rb then renders the eight
        # PDF CVs to _site/files/ from the print pages, and fails the build
        # when Chrome is missing or a CV exceeds tracks.yml cv.max_pages
        # (1 page for Software and Data, 2 for Research).
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          BROWSER_PATH: ${{ steps.chrome.outputs.path || steps.setup-chrome.outputs.chrome-path }}
      - name: Attach the CV PDFs to the run
        # Pull requests only: the eight PDFs, downloadable from the run page
        # for review, before anything is deployed. Runs before the checks so
        # they are available even when a check fails.
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: _site/files/*.pdf
          if-no-files-found: error
          retention-days: 7
      - name: Check links and space isolation
        # html-proofer (internal links, images, scripts) plus the
        # SpaceIsolation check: a space page never links to the portal or
        # to another space. Runs after the build, so the links to the eight
        # PDFs are checked like any other; a failure blocks the deployment.
        run: bundle exec ruby scripts/check-isolation.rb
      - name: Upload artifact
        # Only a push to master is deployed.
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
