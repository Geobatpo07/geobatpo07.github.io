# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Pull requests into master: build, generate the CVs and run the
  # checks, without uploading or deploying anything.
  pull_request:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
# Pull requests get their own group, cancelled by a newer push to the same PR.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.207.0
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        # Skipped on pull requests: base_path is then empty (custom domain).
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Validate resume.yml
        # Resume Loader validation — fails the build with a clear error
        # list if _data/resume.yml is missing required fields.
        run: ruby scripts/validate_resume.rb
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install PDF generation dependencies
        run: npm install --no-save playwright http-server
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Generate CV PDFs and check their length
        # Renders /resume-print/ to files/Profile.pdf and each space print
        # page to files/CV_Laguerre_<Space>_<FR|EN>.pdf, from _data, so the
        # PDFs never drift from the site. Blocking: fails when a Software or
        # Data CV exceeds 1 page, a Research CV 2 pages (tracks.yml
        # cv.max_pages), or a cv block references an unknown id.
        run: node scripts/generate-cv-pdf.mjs
      - name: Check links and space isolation
        # html-proofer (internal links, images, scripts) plus the
        # SpaceIsolation check: a space page never links to the portal or
        # to another space. Runs after the PDF step so the linked PDFs
        # exist; a failure blocks the deployment.
        run: bundle exec ruby scripts/check-isolation.rb
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
