title_separator          : "-"
name                     : &name "Geovany Batista Polo LAGUERRE"
description              : &description "Software & Data Engineer: C#/.NET, Java, Python, TypeScript, SQL. From mathematical model to production system."
url                      : https://geovanylaguerre.net # Canonical base URL used for sitemaps, canonical links, and structured data
                                                           # or if you already have some other page hosted on Github then use "https://[your GitHub username].github.io/[Your Repo Name]"
baseurl                  : "" # the subpath of your site, e.g. "/blog"
repository               : "Geobatpo07/geobatpo07.github.io"

