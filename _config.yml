    title: 'Journal Articles'
  conferences:
    title: 'Conference Papers'
  manuscripts:
    title: 'Preprints & Research Notes'
  technical_reports:
    title: 'Technical Reports'
  internship_reports:
    title: 'Research Internship Reports'
